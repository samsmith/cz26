<!-- Drop everything below into your page. The component renders itself into #setup. -->
<div id="setup"></div>

<style>
  #setup {
    max-width: 26rem;
    font-family: system-ui, sans-serif;
    color: #2b2b33;
  }
  #setup h2 {
    font-size: 1.25rem;
    margin: 0 0 0.5rem;
  }
  #setup p.setup-desc {
    font-size: 0.9rem;
    line-height: 1.5;
    color: #5a5a66;
    margin: 0 0 1rem;
  }
  #setup p.setup-desc a {
    color: #4a6fa5;
    font-weight: 600;
  }
  #setup .setup-progress {
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #8a8a96;
    margin: 0 0 0.75rem;
  }
  #setup input,
  #setup select {
    box-sizing: border-box;
    padding: 0.6rem 0.7rem;
    font-size: 1rem;
    border: 1px solid #c9c9d4;
    border-radius: 6px;
    background: #fff;
    margin-bottom: 0.5rem;
  }
  #setup input {
    display: block;
    width: 100%;
  }
  #setup .setup-time-row {
    display: flex;
    gap: 0.5rem;
  }
  #setup .setup-time-row select {
    flex: 1;
  }
  #setup input:focus,
  #setup select:focus {
    outline: 2px solid #4a6fa5;
    outline-offset: 1px;
  }
  #setup .setup-error {
    font-size: 0.85rem;
    color: #a53a3a;
    min-height: 1.2em;
    margin: 0 0 0.5rem;
  }
  #setup button {
    padding: 0.55rem 1.4rem;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #4a6fa5;
    color: #fff;
    cursor: pointer;
  }
  #setup button:disabled {
    background: #b8c4d6;
    cursor: default;
  }
</style>

<script>
(function () {
  "use strict";

  var container = document.getElementById("setup");

  // --- hashing -----------------------------------------------------------

  // sha256(string) -> lowercase hex string
  async function sha256(str) {
    var data = new TextEncoder().encode(str);
    var buf = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(buf))
      .map(function (b) { return b.toString(16).padStart(2, "0"); })
      .join("");
  }

  // Local date as YYYY-MM-DD
  function todayYMD() {
    var d = new Date();
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }

  var hashed = null; // overwritten at every step

  // --- helpers -----------------------------------------------------------

  var DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

  function makeSelect(id, firstLabel, options) {
    var html = '<select id="' + id + '"><option value="">' + firstLabel + "</option>";
    options.forEach(function (o) {
      html += '<option value="' + o + '">' + o + "</option>";
    });
    return html + "</select>";
  }

  // Extracts coordinates from a URL string. Accepts either:
  //   - lat= and long= query params, or
  //   - Apple's coordinate= param, holding "lat,long" (the comma often
  //     arrives URL-encoded as %2C; URLSearchParams decodes it for us).
  // Returns { lat, long } or null if coordinates can't be found.
  function parseLatLong(link) {
    var params;
    try {
      params = new URLSearchParams(new URL(link).search);
    } catch (e) {
      return null;
    }

    var lat = params.get("lat");
    var long = params.get("long");
    if (lat && long) return { lat: lat, long: long };

    var coordinate = params.get("coordinate");
    if (coordinate) {
      var parts = coordinate.split(",");
      if (parts.length === 2 && parts[0] !== "" && parts[1] !== "") {
        return { lat: parts[0], long: parts[1] };
      }
    }

    // Google Maps path form: .../maps/@51.4813,-1.8912,15z
    // (captures only the two coordinates, ignoring any trailing zoom)
    var at = link.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
    if (at) return { lat: at[1], long: at[2] };

    return null;
  }

  // --- screens -----------------------------------------------------------
  // Each screen supplies its own fields (as HTML) and a getValue() that
  // returns either { value: <string to hash> } or { error: <message> }.

  var screens = [
    {
      title: "A day and time you feel most safe",
      desc: "A day and time of the week you feel most safe, which you wish it could be for longer.",
      fields: function () {
        var hours = [];
        for (var h = 0; h < 24; h++) hours.push(String(h).padStart(2, "0"));
        return makeSelect("setup-day", "Day\u2026", DAYS) +
          '<div class="setup-time-row">' +
          makeSelect("setup-hour", "Hour\u2026", hours) +
          "</div>";
      },
      getValue: function () {
        var day = document.getElementById("setup-day").value;
        var hour = document.getElementById("setup-hour").value;
        if (!day || !hour) return { error: "Please choose a day and hour." };
        // Canonical format hashed: "Monday 09"
        return { value: day + " " + hour };
      }
    },
    {
      title: "A place you feel most safe",
      desc: 'Think of somewhere you could go where you feel safest. It could be real, or from a story \u2014 somewhere you feel safe. Open <a href="https://maps.google.com" target="_blank" rel="noopener">Google Maps</a> or <a href="https://maps.apple.com" target="_blank" rel="noopener">Apple Maps</a> and steer (don\u0027t search) to that place, then tap Share \u2192 Copy, and paste the result into this box.',
      fields: function () {
        return '<input id="setup-link" type="text" autocomplete="off" placeholder="Paste your maps link here">';
      },
      getValue: function () {
        var link = document.getElementById("setup-link").value.trim();
        if (!link) return { error: "Please paste a link." };
        var coords = parseLatLong(link);
        if (!coords) return { error: "That link doesn't contain coordinates \u2014 please paste the full shared link." };
        // Canonical format hashed: "lat,long" exactly as they appear in the link
        return { value: coords.lat + "," + coords.long };
      }
    },
    {
      title: "A passphrase known only to people who make you feel safe",
      desc: "You can always change this in future.",
      fields: function () {
        return '<input id="setup-pass" type="text" autocomplete="off" placeholder="Enter your passphrase">';
      },
      getValue: function () {
        var pass = document.getElementById("setup-pass").value.trim();
        if (!pass) return { error: "Please enter a passphrase." };
        return { value: pass };
      }
    }
  ];

  var current = 0;

  function render() {
    var s = screens[current];
    container.innerHTML =
      '<p class="setup-progress">Step ' + (current + 1) + " of " + screens.length + "</p>" +
      "<h2></h2>" +
      '<p class="setup-desc"></p>' +
      s.fields() +
      '<p class="setup-error" aria-live="polite"></p>' +
      "<button>" + (current === screens.length - 1 ? "Finish" : "Next") + "</button>";

    container.querySelector("h2").textContent = s.title;
    // desc strings are static, developer-authored HTML (needed for the maps links)
    container.querySelector(".setup-desc").innerHTML = s.desc;

    var button = container.querySelector("button");

    function submit() {
      var result = s.getValue();
      var errorEl = container.querySelector(".setup-error");
      if (result.error) { errorEl.textContent = result.error; return; }
      errorEl.textContent = "";
      button.disabled = true;

      // Chain: hashed = sha256(input + previous hashed), overwriting each time
      sha256(result.value + hashed).then(function (h) {
        hashed = h;
        current++;
        if (current < screens.length) {
          render();
        } else {
          finish();
        }
      });
    }

    button.addEventListener("click", submit);
    container.querySelectorAll("input").forEach(function (input) {
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") submit();
      });
    });
  }

  function finish() {
    container.innerHTML = "<h2>All set</h2>" +
      '<p class="setup-desc">Your setup is complete.</p>';

    // Hand the final hash to the rest of the app (integration hooks):
    container.dispatchEvent(new CustomEvent("setup-complete", {
      detail: { hashed: hashed },
      bubbles: true
    }));
    if (typeof window.onSetupComplete === "function") {
      window.onSetupComplete(hashed);
    }
  }

  // --- start session -----------------------------------------------------

  sha256(todayYMD()).then(function (h) {
    hashed = h;   // hashed = sha256(YYYY-MM-DD)
    render();
  });
})();
</script>
